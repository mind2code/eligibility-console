server {
    listen 80;
    server_name eligibility-admin.univers.ci;
    root /usr/share/nginx/html;
    index index.html;

    # location /api/scrums {
    #     proxy_pass http://scrum-app:8080/api/scrums;
    # }

    # location /api/tasks {
    #     proxy_pass http://scrum-app:8080/api/tasks;
    # }

    location / {
        # try_files $uri $uri/ /index.html;
        try_files $uri /index.html;
    }

    location /api {
        proxy_pass https://api-eligibility.univers.ci/api;
    }

}


