<div class="page-wrapper">

    <!-- Breadcrumb -->
    <div class="d-md-flex d-block align-items-center justify-content-between mb-3">

      <div class="d-flex my-xl-auto right-content align-items-center flex-wrap ">

        <div class="me-2 mb-2">
          <div class="dropdown">
            <a href="javascript:void(0);" class="dropdown-toggle btn btn-white d-inline-flex align-items-center" data-bs-toggle="dropdown">
              <i class="ti ti-file-export me-1"></i>Export
            </a>
            <ul class="dropdown-menu  dropdown-menu-end p-3">
              <li>
                <a href="javascript:void(0);" class="dropdown-item rounded-1"><i class="ti ti-file-type-pdf me-1"></i>Export as PDF</a>
              </li>
              <li>
                <a href="javascript:void(0);" class="dropdown-item rounded-1"><i class="ti ti-file-type-xls me-1"></i>Export as Excel </a>
              </li>
            </ul>

        <div class="mb-2">

        </div>
        <app-collapse-header></app-collapse-header>
      </div>
    </div>
    <!-- /Breadcrumb -->
    <div class="row">
      <div class="col-lg-6">
        <div class="card">
          <div class="card-header">
            <h5 class="card-title">Demande de rechargement</h5>
          </div>
          <div class="card-body">
            <form action="#">
                <div class="mb-3">
                  <label class="form-label" for="last">Partenaire</label>
                  <select class="form-select" aria-label="Default select example">
                    <option selected>Choisir le partenaire</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="first">Montant de la recharge</label>
                  <input type="number" class="form-control">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="tag">Commentaire</label>
                  <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>

                  <label class="form-label" for="tag">Username</label>
                  <input type="text" class="form-control">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="tag">Password</label>
                  <input type="password" class="form-control">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="tag">Repeat Password</label>
                  <input type="password" class="form-control">
                </div> -->

                  <button type="submit" class="btn btn-primary">Soumettre la demande</button>
                </div>

              </form>
          </div>
        </div>
      </div>
    </div>
